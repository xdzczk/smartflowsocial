# Postgres and Redis for local development.
# `pnpm dev` starts the web server and the worker. Do not run `pnpm start:worker` beside it.
# The production publisher is https://github.com/xdzczk/smartflowsocial-publisher (a Cloudflare Worker).
# On a laptop, `pnpm publisher:local` is a signature-checking stand-in. It does not open relays.
services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
