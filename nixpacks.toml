[phases.setup]
# Pin the Node major explicitly: the bare "nodejs" attribute resolves to
# whatever nixpkgs ships at build time, so production could silently change
# majors between deploys. Keep in sync with .nvmrc and the CI node-version.
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "node ./build/server.js & node ./build/worker.js & wait"