name: Performance Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit-performance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit performance tests
        run: npm run test:performance
        env:
          NODE_ENV: test

  load-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run API endpoints load test
        run: k6 run tests/performance/api-endpoints.js
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'http://localhost:3000' }}
        continue-on-error: true

      - name: Run bulk operations load test
        run: k6 run tests/performance/bulk-operations.js
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'http://localhost:3000' }}
        continue-on-error: true

      - name: Run loader performance test
        run: k6 run tests/performance/loader-performance.js
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'http://localhost:3000' }}
        continue-on-error: true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: tests/performance/results/
          retention-days: 30

