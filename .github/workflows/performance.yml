name: Performance Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres

      - name: Setup test database
        run: pnpm exec prisma db push
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run unit performance tests
        run: pnpm test:performance
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

  load-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      matrix:
        staging_url_secret_name: [STAGING_URL]
    env:
      BASE_URL: ${{ secrets[matrix.staging_url_secret_name] || 'http://localhost:3000' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Prepare performance results directory
        run: mkdir -p tests/performance/results

      - name: Run API endpoints load test
        run: k6 run --summary-export tests/performance/results/api-endpoints-summary.json tests/performance/api-endpoints.js

      - name: Run bulk operations load test
        run: k6 run --summary-export tests/performance/results/bulk-operations-summary.json tests/performance/bulk-operations.js

      - name: Run loader performance test
        run: k6 run --summary-export tests/performance/results/loader-performance-summary.json tests/performance/loader-performance.js

      - name: Run spike load test
        run: k6 run --summary-export tests/performance/results/spike-load-summary.json tests/performance/spike-load.js

      - name: Run soak load test
        run: k6 run --summary-export tests/performance/results/soak-load-summary.json tests/performance/soak-load.js

      - name: Enforce performance budget
        run: node scripts/check-performance-budgets.mjs --source=k6 --dir=tests/performance/results

      - name: Upload performance results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-results
          path: tests/performance/results/
          retention-days: 30
