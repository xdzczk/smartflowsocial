name: Load Tests (k6)

# The vitest performance suite runs in ci.yml on every push/PR. This workflow
# only runs the k6 load tests against staging, nightly and on demand.

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-tests:
    name: k6 load tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ secrets.STAGING_URL || 'http://localhost:3000' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Prepare performance results directory
        run: mkdir -p tests/performance/results

      - name: Run API endpoints load test
        run: k6 run --summary-export tests/performance/results/api-endpoints-summary.json tests/performance/api-endpoints.js

      - name: Run bulk operations load test
        run: k6 run --summary-export tests/performance/results/bulk-operations-summary.json tests/performance/bulk-operations.js

      - name: Run loader performance test
        run: k6 run --summary-export tests/performance/results/loader-performance-summary.json tests/performance/loader-performance.js

      - name: Run spike load test
        run: k6 run --summary-export tests/performance/results/spike-load-summary.json tests/performance/spike-load.js

      - name: Run soak load test
        run: k6 run --summary-export tests/performance/results/soak-load-summary.json tests/performance/soak-load.js

      - name: Enforce performance budget
        run: node scripts/check-performance-budgets.mjs --source=k6 --dir=tests/performance/results

      - name: Upload performance results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: tests/performance/results/
          retention-days: 30
