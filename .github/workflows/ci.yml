name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_ENV: test

jobs:
  # Lint and type check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            **/*.tsbuildinfo
          key: ts-${{ runner.os }}-${{ hashFiles('**/*.ts', '**/*.tsx', 'tsconfig.json', 'tests/e2e/tsconfig.json') }}
          restore-keys: |
            ts-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run ESLint (no cache)
        run: pnpm lint:ci

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: Run TypeScript type check
        run: |
          set +e  # Don't exit on error, we'll handle it manually

          # Run type check and capture output
          pnpm exec tsc --noEmit --skipLibCheck > /tmp/tsc-output.log 2>&1
          TSC_EXIT=$?

          # Filter errors from our codebase (exclude node_modules)
          ERRORS=$(grep -E "error TS" /tmp/tsc-output.log | grep -E "(app/|tests/|prisma/|server\.ts|worker\.ts)" || true)

          if [ -n "$ERRORS" ]; then
            echo "❌ TypeScript errors found in codebase:"
            echo "$ERRORS"
            exit 1
          fi

          # Check e2e tsconfig
          if [ -f "tests/e2e/tsconfig.json" ]; then
            pnpm exec tsc -p tests/e2e/tsconfig.json --noEmit --skipLibCheck > /tmp/tsc-e2e-output.log 2>&1
            TSC_E2E_EXIT=$?
            E2E_ERRORS=$(grep -E "error TS" /tmp/tsc-e2e-output.log | grep -v "node_modules" || true)
            
            if [ -n "$E2E_ERRORS" ]; then
              echo "❌ TypeScript errors found in e2e tests:"
              echo "$E2E_ERRORS"
              exit 1
            fi
          fi

          echo "✅ TypeScript type check passed (all configs)"

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run unit tests
        run: pnpm test:unit
        id: unit-tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: |
            test-results/unit-*.xml
            test-results/unit-*.json
          retention-days: 7
          if-no-files-found: ignore

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run integration tests
        run: pnpm test:integration
        id: integration-tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: |
            test-results/integration-*.xml
            test-results/integration-*.json
          retention-days: 7
          if-no-files-found: ignore

  # Property-based tests
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run property-based tests
        run: pnpm test:property
        id: property-tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Upload property test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: property-test-results
          path: |
            test-results/property-*.xml
            test-results/property-*.json
          retention-days: 7
          if-no-files-found: ignore

  # Security tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security tests
        run: pnpm test:security
        id: security-tests

      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-test-results
          path: |
            test-results/security-*.xml
            test-results/security-*.json
          retention-days: 7
          if-no-files-found: ignore

  # Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run performance tests
        run: pnpm test:performance
        id: performance-tests
        continue-on-error: true

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-test-results
          path: |
            test-results/performance-*.xml
            test-results/performance-*.json
          retention-days: 7
          if-no-files-found: ignore

  # Test summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        unit-tests,
        integration-tests,
        property-tests,
        security-tests,
        performance-tests,
      ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          pattern: "*-test-results"
          merge-multiple: true
          path: test-results

      - name: Generate test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Property-Based Tests | ${{ needs.property-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.property-tests.result }}" != "success" ] || \
             [ "${{ needs.security-tests.result }}" != "success" ]; then
            echo "One or more test suites failed"
            exit 1
          fi
