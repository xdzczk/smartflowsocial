name: Flaky Test Detection

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to check for flaky tests"
        required: true
        type: choice
        options:
          - unit
          - integration
          - property
          - security
          - performance
      runs:
        description: "Number of test runs"
        required: false
        default: "10"
        type: string

jobs:
  # GitHub expressions have no range(); build the [1..N] matrix in a shell step.
  prepare-matrix:
    name: Prepare run matrix
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.matrix.outputs.runs }}
    steps:
      - name: Build run list
        id: matrix
        run: |
          count="${{ inputs.runs }}"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ]; then count=10; fi
          if [ "$count" -gt 50 ]; then count=50; fi
          runs=$(seq -s, 1 "$count")
          echo "runs=[$runs]" >> "$GITHUB_OUTPUT"
          echo "Will run ${{ inputs.test_suite }} tests $count times"

  detect-flaky-tests:
    name: Detect Flaky Tests (${{ inputs.test_suite }})
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.prepare-matrix.outputs.runs) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres

      - name: Setup test database
        run: pnpm exec prisma db push
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run ${{ inputs.test_suite }} tests (Run ${{ matrix.run }})
        run: |
          case "${{ inputs.test_suite }}" in
            unit)
              pnpm test:unit
              ;;
            integration)
              pnpm test:integration
              ;;
            property)
              pnpm test:property
              ;;
            security)
              pnpm test:security
              ;;
            performance)
              pnpm test:performance
              ;;
          esac
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
        id: test-run
        continue-on-error: true

      - name: Save test results
        if: always()
        run: |
          mkdir -p flaky-test-results
          echo "${{ steps.test-run.outcome }}" > "flaky-test-results/run-${{ matrix.run }}.txt"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-results-${{ inputs.test_suite }}-run-${{ matrix.run }}
          path: flaky-test-results
          retention-days: 30

  analyze-flaky-tests:
    name: Analyze Flaky Tests
    runs-on: ubuntu-latest
    needs: detect-flaky-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          pattern: "flaky-test-results-*"
          merge-multiple: true
          path: flaky-test-results

      - name: Analyze results
        run: |
          echo "## Flaky Test Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Analyzing test results for ${{ inputs.test_suite }} tests..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Concatenate first: `grep -c` over several files prints one count per file.
          total_runs=$(ls flaky-test-results/*.txt 2>/dev/null | wc -l | tr -d ' ')
          success_count=$(cat flaky-test-results/*.txt 2>/dev/null | grep -c "success" || true)
          failure_count=$(cat flaky-test-results/*.txt 2>/dev/null | grep -c "failure" || true)

          echo "Total runs: $total_runs" >> $GITHUB_STEP_SUMMARY
          echo "Successful: $success_count" >> $GITHUB_STEP_SUMMARY
          echo "Failed: $failure_count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$failure_count" -gt 0 ] && [ "$success_count" -gt 0 ]; then
            echo "⚠️ **Flaky tests detected!** Some tests passed and some failed across multiple runs." >> $GITHUB_STEP_SUMMARY
          elif [ "$failure_count" -eq 0 ]; then
            echo "✅ All tests passed consistently across all runs." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ All test runs failed. This may indicate a real issue, not flakiness." >> $GITHUB_STEP_SUMMARY
          fi
