name: Smoke Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggering

env:
  NODE_ENV: test

jobs:
  smoke-test:
    name: Smoke Test (Lint + Typecheck + Unit + Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fail fast if something is broken
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Generate TypeScript type information
        run: |
          ERRORS=$(pnpm exec tsc --noEmit --skipLibCheck 2>&1 | grep -E "^(app/|tests/|prisma/|server\.ts|worker\.ts)" || true)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
            exit 1
          fi
          echo "✅ TypeScript type check passed (node_modules errors ignored)"

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push --skip-generate
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run ESLint (no cache)
        run: pnpm lint:ci
        continue-on-error: false

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit --skipLibCheck
        continue-on-error: false

      - name: Run unit tests
        run: pnpm test:unit
        continue-on-error: false
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run integration tests
        run: pnpm test:integration
        continue-on-error: false
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Smoke test summary
        if: always()
        run: |
          echo "## ✅ Smoke Test Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All critical checks passed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type Check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration Tests" >> $GITHUB_STEP_SUMMARY






