name: Smoke Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggering

env:
  NODE_ENV: test

jobs:
  smoke-test:
    name: Smoke Test (Lint + Typecheck + Unit + Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fail fast if something is broken

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            **/*.tsbuildinfo
          key: ts-${{ runner.os }}-${{ hashFiles('**/*.ts', '**/*.tsx', 'tsconfig.json', 'tests/e2e/tsconfig.json') }}
          restore-keys: |
            ts-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push --skip-generate
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run ESLint (no cache)
        run: pnpm lint:ci
        continue-on-error: false

      - name: Run TypeScript type check
        run: |
          set +e  # Don't exit on error, we'll handle it manually

          # Run type check and capture output
          pnpm exec tsc --noEmit --skipLibCheck > /tmp/tsc-output.log 2>&1
          TSC_EXIT=$?

          # Filter errors from our codebase (exclude node_modules)
          ERRORS=$(grep -E "error TS" /tmp/tsc-output.log | grep -E "(app/|tests/|prisma/|server\.ts|worker\.ts)" || true)

          if [ -n "$ERRORS" ]; then
            echo "❌ TypeScript errors found in codebase:"
            echo "$ERRORS"
            exit 1
          fi

          # Check e2e tsconfig
          if [ -f "tests/e2e/tsconfig.json" ]; then
            pnpm exec tsc -p tests/e2e/tsconfig.json --noEmit --skipLibCheck > /tmp/tsc-e2e-output.log 2>&1
            TSC_E2E_EXIT=$?
            E2E_ERRORS=$(grep -E "error TS" /tmp/tsc-e2e-output.log | grep -v "node_modules" || true)
            
            if [ -n "$E2E_ERRORS" ]; then
              echo "❌ TypeScript errors found in e2e tests:"
              echo "$E2E_ERRORS"
              exit 1
            fi
          fi

          echo "✅ TypeScript type check passed (all configs)"
        continue-on-error: false

      - name: Run unit tests
        run: pnpm test:unit
        continue-on-error: false
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Run integration tests
        run: pnpm test:integration
        continue-on-error: false
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Smoke test summary
        if: always()
        run: |
          echo "## ✅ Smoke Test Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All critical checks passed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type Check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration Tests" >> $GITHUB_STEP_SUMMARY
