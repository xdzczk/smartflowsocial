name: Test Caching Optimization

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_ENV: test

jobs:
  cached-tests:
    name: Cached Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            app/**
            tests/**

      - name: Cache test results
        uses: actions/cache@v4
        with:
          path: |
            .vitest-cache
            node_modules/.cache
            test-results
          key: ${{ runner.os }}-test-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('tests/**/*.test.ts') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-test-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push --skip-generate
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run tests with cache
        run: |
          if [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]; then
            echo "Files changed, running all tests"
            pnpm test
          else
            echo "No test-related files changed, skipping tests"
          fi
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Save test cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            .vitest-cache
            node_modules/.cache
            test-results
          key: ${{ runner.os }}-test-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('tests/**/*.test.ts') }}
