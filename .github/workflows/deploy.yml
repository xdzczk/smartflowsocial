name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: production

jobs:
  # Run all tests before deployment
  pre-deploy-tests:
    name: Pre-Deploy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            **/*.tsbuildinfo
          key: ts-${{ runner.os }}-${{ hashFiles('**/*.ts', '**/*.tsx', 'tsconfig.json', 'tests/e2e/tsconfig.json') }}
          restore-keys: |
            ts-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push --skip-generate
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run lint (no cache)
        run: pnpm lint:ci

      - name: Run type check
        run: |
          set +e  # Don't exit on error, we'll handle it manually

          # Run type check and capture output
          pnpm exec tsc --noEmit --skipLibCheck > /tmp/tsc-output.log 2>&1
          TSC_EXIT=$?

          # Filter errors from our codebase (exclude node_modules)
          ERRORS=$(grep -E "error TS" /tmp/tsc-output.log | grep -E "(app/|tests/|prisma/|server\.ts|worker\.ts)" || true)

          if [ -n "$ERRORS" ]; then
            echo "❌ TypeScript errors found in codebase:"
            echo "$ERRORS"
            exit 1
          fi

          # Check e2e tsconfig
          if [ -f "tests/e2e/tsconfig.json" ]; then
            pnpm exec tsc -p tests/e2e/tsconfig.json --noEmit --skipLibCheck > /tmp/tsc-e2e-output.log 2>&1
            TSC_E2E_EXIT=$?
            E2E_ERRORS=$(grep -E "error TS" /tmp/tsc-e2e-output.log | grep -v "node_modules" || true)
            
            if [ -n "$E2E_ERRORS" ]; then
              echo "❌ TypeScript errors found in e2e tests:"
              echo "$E2E_ERRORS"
              exit 1
            fi
          fi

          echo "✅ TypeScript type check passed (all configs)"

      - name: Run all tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Run security tests
        run: pnpm test:security
        env:
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Check coverage thresholds
        run: |
          pnpm test:coverage
          node -e "
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;
            const thresholds = { lines: 50, functions: 45, branches: 40, statements: 50 };
            let failed = false;
            for (const [metric, threshold] of Object.entries(thresholds)) {
              const actual = total[metric].pct;
              if (actual < threshold) {
                console.error(\`❌ \${metric}: \${actual.toFixed(2)}% < \${threshold}%\`);
                failed = true;
              }
            }
            process.exit(failed ? 1 : 0);
          "
        env:
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

  # Build application
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: pre-deploy-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  # Deploy (placeholder - customize for your deployment platform)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-production-url.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: build/

      - name: Deploy to production
        run: |
          echo "Deploy to your platform here"
          # Example: Deploy to Fly.io, Railway, Vercel, etc.
          # flyctl deploy
          # railway up
          # vercel --prod
