name: Test Matrix

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_ENV: test

jobs:
  test-matrix:
    name: Test ${{ matrix.test-type }} on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
        test-type: ["unit", "integration"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@v1
        with:
          database: smartflow_test
          user: postgres
          password: postgres

      - name: Setup test database
        run: pnpm exec prisma db push
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test

      - name: Run ${{ matrix.test-type }} tests
        run: |
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            pnpm test:unit
          else
            pnpm test:integration
          fi
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartflow_test
          SESSION_SECRET: test-session-secret-very-long-and-secure-32-chars-minimum

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-node-${{ matrix.node-version }}-${{ matrix.test-type }}
          path: |
            test-results/*.xml
            test-results/*.json
          retention-days: 7
          if-no-files-found: ignore
